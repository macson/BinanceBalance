# Basic checks for every pull request. The merge agent only merges code
# changes once these pass on the pull request's latest commit.
# They never run project code, call paid APIs or need secrets.
name: checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python files compile
        run: python -m compileall -q .

